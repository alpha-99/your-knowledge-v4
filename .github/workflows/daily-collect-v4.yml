name: V4 Daily AI Knowledge Collection

# 每天 UTC 00:00（北京时间 08:00）自动采集
# 和 V2 的 workflow 错开 8 小时,避免同时 commit
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

defaults:
  run:
    working-directory: ./

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V4 pipeline (collect + analyze + organize)
        env:
          # 复用 V2 已配好的 DeepSeek secret(避免学员重复配置)
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # LLM_BASE_URL 可用仓库变量覆盖(非敏感,用 vars)；未配置时回退 DeepSeek 默认
          # 设置方式: 仓库 Settings → Secrets and variables → Actions → Variables → 新增 LLM_BASE_URL
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
          # LLM_MODEL 同 LLM_BASE_URL：可用仓库变量覆盖，未配置时回退 deepseek-chat
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
          PRICE_INPUT_PER_MILLION: "1.0"
          PRICE_OUTPUT_PER_MILLION: "2.0"
          PLANNER_TARGET_COUNT: "10"
          # 每源采集上限（全局配置：统一作用于 GitHub + RSS，覆盖三档策略的默认值）
          # 注意：RSS 单个源可在 rss_sources.yaml 里配 limit 字段覆盖此全局值
          PER_SOURCE_LIMIT: "5"
          # GitHub API rate limit 用仓库自带 token 提权
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # RSS 多源采集：显式开启，全局每源上限取 plan 的 per_source_limit（与 GitHub 同一变量）
          # 两层配置：源级 limit 优先 → 未配置回退全局；源数×每源上限 ≈ 总条数
          RSS_ENABLED: "1"
        run: |
          # --no-publish: 不做分发,只跑 plan → collect → analyze → review → organize
          # 分发由本地 OpenClaw Bot / 系统 cron 单独负责(secrets 在本地配)
          python -m pipeline.pipeline --no-publish

      - name: Regenerate articles index.json
        run: |
          # Bot 读的入口文件——每次采集后重新生成保证和实际文件一致
          # 条目按天分文件夹存放: knowledge/articles/{YYYY-MM-DD}/{id}.json
          python3 <<'PY'
          import json, glob, os
          arts = []
          for f in sorted(glob.glob('knowledge/articles/*/*.json')):
              try:
                  d = json.load(open(f))
                  arts.append({
                      'id': d.get('id'),
                      'title': d.get('title'),
                      'category': d.get('category'),
                      'relevance_score': d.get('relevance_score'),
                      # 相对路径一并写入,消费者按 path 直读,不必再猜目录
                      'path': os.path.relpath(f, '.').replace(os.sep, '/'),
                  })
              except Exception as e:
                  print(f'skip {f}: {e}')
          json.dump(arts, open('knowledge/articles/index.json', 'w'),
                    indent=2, ensure_ascii=False)
          print(f'regenerated index: {len(arts)} items')
          PY

      - name: Show summary
        run: |
          echo "========== V4 采集结果 =========="
          find knowledge/articles -name '*.json' ! -name 'index.json' | wc -l
          echo "当天有数据的日期文件夹:"
          ls knowledge/articles/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          echo "最近 5 个新文件:"
          find knowledge/articles -name '*.json' ! -name 'index.json' -printf '%T@ %p\n' \
            | sort -rn | head -5 | cut -d' ' -f2-
          echo "================================"

      - name: Commit and push results
        # 整个 job 的 working-directory 是 v4-production,
        # 所以这里的 git add 用相对路径 knowledge/ 即可
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add knowledge/
          if git diff --staged --quiet; then
            echo "No new articles to commit"
          else
            COUNT=$(git diff --staged --name-only | grep -Ec 'knowledge/articles/[0-9]{4}-[0-9]{2}-[0-9]{2}/' || true)
            git commit -m "chore(v4): daily collection - $COUNT new/updated articles [$(date -u +%Y-%m-%d)]"
            git push
          fi
